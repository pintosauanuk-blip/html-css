<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible Boxel model</title>
    <style>
        .container{
            display: flex;
            height: 150px;
            background-color: brown;
            flex-flow: column wrap;
            
            
        }
        .item{
           background-color: blue; 
           border: 2px solid darkgray;
           color: white;
           text-align: center;
           padding: 10px;
           flex: auto; 
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item">Exemplo de Bloco A</div>
        <div class="item">Exemplo de Bloco B</div>
        <div class="item">Exemplo de Bloco C</div>
        <div class="item">Exemplo de Bloco D</div>
        <div class="item">Exemplo de Bloco E</div>
        <div class="item">Exemplo de Bloco F</div>
    </div>
</body>
</html>
<!--Anotações Flexbox:
Justify-content: faz o alinhamento em relação ao main-axis.
ao atribuir uma caracteristica ao justify-content, como flex-start, significa que o primeiro conteúdo dentro do container estará alinhado a parte inicial do main-axis

todo item que estiver num container com display flex, sempre terá um 
order=0.

align-self funciona para os itens no eixo transversal ou eixo de Y

por padrão, o flex-shrink é 1 e o flex-grow é 0, são opostos;

Para configurar o container (Pai) usamos: justify-content; align-item; display:flex; 
Para configurar o item (filho): flex:auto; flex-shrink; flex-grow; align-content;
-->
