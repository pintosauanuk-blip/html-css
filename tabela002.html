<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        td{
            border: 3px solid black;
            width: 400px;
            text-align: center;
        }
        th{
            border: 3px solid black;
            background-color: gray;
            color: white;
        }
        table{
            border-collapse: collapse;
        }
        caption{
            font-family: sans-serif;
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
            background-color: lightgray;
        }
        tbody>tr:nth-child(2n){
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <h1> Uso de tabelas grandes</h1>
    <table>
        <caption>Os 7 Paises mais populosos do mundo.</caption>
        <thead>
            <tr>
                <th scope="col">País</th>
                <th scope="col">População</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>India</td>
                <td>1 417 492 000</td>
            </tr>
            <tr>
                <td>China</td>
                <td>1 407 934 000</td>
            </tr>
            <tr>
                <td>Estados Unidos da América</td>
                <td>342 181 000</td>
            </tr>
            <tr>
                <td>
                    Indonesia
                </td>
                <td> 285 783 000</td>
            </tr>
            <tr>
                <td>Paquistão</td>
                <td>256 204 000</td>
            </tr>
            <tr>
                <td>Nigéria</td>
                <td>236 213 000</td>
                
            </tr>
            <tr>
                <td>Brasil</td>
                <td>214 244 000</td>
            </tr>
        </tbody>
        <tfoot>
            <th scope="row">Total de Habitantes</th>
            <th scope="row">4.160.051.000</th>
        </tfoot>
    </table>
</body>
</html>
