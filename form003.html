<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form{
            background-color: lightgray ;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Teste de Formulario</h1>
    <form action="">
        <p>
            <label for="inome">Nome</label>
            <input type="text" name="nome" id="inome" required autocomplete="name" minlength="5" maxlength="12">
        </p>
        <p>
            <label for="imes">Mes</label>
            <input type="month" name="mes" id="imes">
            <input type="date" name="data" id="idade">
            <input type="time" name="time" id="itme">
        </p>
        <p><label for="imedia">Media</label>
        <input type="number" name="Media" id="imedia" min="0" max="20" value="10"></p>

        <p><input type="submit" value="Enviar"></p>
        <p><input type="reset" value="Resetar"></p>
    </form>
</body>
</html>
