<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="cadastro.php" method="get">
        <p>
            <label for="inum1">Número1</label>
            <input type="number" name="number" id="inum1" placeholder="digite um Número" min="0" max="50" required oninput="isoma.innerHTML= Number(inum1.value) + Number(inum2.value)">


        </p>
        
        <p>
            <label for="inum2">Número2</label> 
            <input type="number" name="number" id="inum2" placeholder="digite um Número" min="0" max="50" required oninput="isoma.innerHTML= Number(inum1.value) + Number(inum2.value)"> 
        </p>
        <p>
            <label for="isoma">Soma</label>
            <output name="Soma" id="isoma">0</output>
        </p>
        <p>
            <label for="inum">Número: </label>
            <input type="range" name="num" id="inum" min="0" max="10" value="4" oninput="ival.innerHTML = Number(inum.value)">
            <output id="ival">5</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Resetar">
        </p>
    </form>
</body>
</html>
